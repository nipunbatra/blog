<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="white"/>

  <text x="20" y="30" font-size="13" fill="#6e6e73" letter-spacing="0.08em">VARIANT B · ASPECT-RATIO RULE</text>
  <text x="20" y="52" font-size="16" font-weight="600" fill="#1d1d1f">Agent loop with a deterministic classification rule on bbox geometry</text>

  <!-- IMAGE -->
  <g transform="translate(20, 100)">
    <rect width="150" height="80" rx="14" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#sh)"/>
    <text x="75" y="30" text-anchor="middle" font-size="12" fill="#6e6e73" letter-spacing="0.05em">INPUT</text>
    <text x="75" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">Satellite tile</text>
  </g>

  <!-- GEMMA -->
  <g transform="translate(220, 85)">
    <rect width="180" height="110" rx="14" fill="#0066cc" filter="url(#sh)"/>
    <text x="90" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)" letter-spacing="0.05em">ORCHESTRATOR</text>
    <text x="90" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="white">Gemma 4</text>
    <text x="90" y="76" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">plans multi-query grounding</text>
    <text x="90" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">reads aspect ratio, applies rule</text>
  </g>

  <!-- TOOL: ground_expression -->
  <g transform="translate(460, 40)">
    <rect width="230" height="70" rx="12" fill="#1d1d1f" filter="url(#sh)"/>
    <text x="115" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" letter-spacing="0.05em">TOOL 1 · ground_expression</text>
    <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="white">"circular brick kiln"</text>
    <text x="115" y="62" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">"rectangular brick kiln" / "chimney"</text>
  </g>

  <!-- TOOL: compute_relations -->
  <g transform="translate(460, 130)">
    <rect width="230" height="70" rx="12" fill="#1d1d1f" filter="url(#sh)"/>
    <text x="115" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" letter-spacing="0.05em">TOOL 2 · compute_relations</text>
    <text x="115" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="white">bbox aspect = max/min</text>
    <text x="115" y="62" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">per mask_id</text>
  </g>

  <!-- RULE BOX -->
  <g transform="translate(460, 230)">
    <rect width="440" height="130" rx="14" fill="white" stroke="#d2d2d7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="220" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">DETERMINISTIC RULE</text>
    <text x="40" y="54" font-size="12" font-family="SF Mono, Menlo, monospace" fill="#1d1d1f">aspect &lt; 1.4</text>
    <text x="260" y="54" font-size="12" font-weight="600" fill="#ff3b30">→ CFCBK</text>
    <text x="40" y="80" font-size="12" font-family="SF Mono, Menlo, monospace" fill="#1d1d1f">1.4 ≤ aspect ≤ 2.5 + chimney</text>
    <text x="260" y="80" font-size="12" font-weight="600" fill="#0a84ff">→ FCBK</text>
    <text x="40" y="106" font-size="12" font-family="SF Mono, Menlo, monospace" fill="#1d1d1f">aspect &gt; 2.5 OR zigzag pattern</text>
    <text x="260" y="106" font-size="12" font-weight="600" fill="#ffa500">→ Zigzag</text>
  </g>

  <!-- ANSWER -->
  <g transform="translate(20, 230)">
    <rect width="180" height="130" rx="14" fill="#34c759" filter="url(#sh)"/>
    <text x="90" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" letter-spacing="0.05em">answer(...)</text>
    <text x="90" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="white">Rule-based label</text>
    <text x="90" y="82" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">supporting_mask_ids</text>
    <text x="90" y="106" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">tiebreaker favours the rule</text>
  </g>

  <!-- ARROWS -->
  <path d="M170,140 L220,140" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M400,115 L460,75" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)"/>
  <path d="M460,95 Q430,110 400,130" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="4,3"/>
  <path d="M400,165 L460,165" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)"/>
  <path d="M460,175 Q430,170 400,175" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="4,3"/>
  <path d="M310,195 L310,230" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M460,295 L200,295" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <text x="425" y="60" font-size="10" fill="#0066cc">call</text>
  <text x="430" y="184" font-size="10" fill="#0066cc">call</text>
</svg>
