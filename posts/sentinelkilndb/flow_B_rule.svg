<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrBl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <filter id="shB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1100" height="560" fill="white"/>

  <text x="40" y="38" font-size="12" fill="#6e6e73" letter-spacing="0.1em" font-weight="500">VARIANT B · ASPECT-RATIO RULE</text>
  <text x="40" y="64" font-size="20" font-weight="600" fill="#1d1d1f" letter-spacing="-0.01em">Agent loop + a deterministic classification rule on bbox geometry</text>

  <!-- Step 1 Input -->
  <g transform="translate(40, 160)">
    <circle cx="14" cy="14" r="14" fill="#1d1d1f"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
    <rect x="40" y="0" width="180" height="90" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2" filter="url(#shB)"/>
    <text x="130" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">INPUT</text>
    <text x="130" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Satellite tile</text>
    <text x="130" y="74" text-anchor="middle" font-size="12" fill="#6e6e73">+ class definitions</text>
  </g>

  <!-- Step 2 Orchestrator -->
  <g transform="translate(300, 150)">
    <circle cx="14" cy="14" r="14" fill="#0066cc"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
    <rect x="40" y="0" width="220" height="110" rx="14" fill="#0066cc" filter="url(#shB)"/>
    <text x="150" y="26" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)" letter-spacing="0.08em">ORCHESTRATOR</text>
    <text x="150" y="54" text-anchor="middle" font-size="16" font-weight="600" fill="white">Gemma 4 31B</text>
    <text x="150" y="78" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">plans tool calls,</text>
    <text x="150" y="94" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">reads JSON metadata</text>
  </g>

  <!-- Step 3 Tool A -->
  <g transform="translate(620, 110)">
    <circle cx="14" cy="14" r="14" fill="#1d1d1f"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
    <rect x="40" y="0" width="260" height="80" rx="12" fill="#1d1d1f" filter="url(#shB)"/>
    <text x="170" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" letter-spacing="0.08em">TOOL · ground_expression</text>
    <text x="170" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="white">"circular kiln" / "oval kiln"</text>
    <text x="170" y="64" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">one or more slots of masks</text>
  </g>

  <!-- Step 4 Tool B -->
  <g transform="translate(620, 220)">
    <circle cx="14" cy="14" r="14" fill="#1d1d1f"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>
    <rect x="40" y="0" width="260" height="80" rx="12" fill="#1d1d1f" filter="url(#shB)"/>
    <text x="170" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" letter-spacing="0.08em">TOOL · compute_relations</text>
    <text x="170" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="white">bbox aspect = max / min</text>
    <text x="170" y="64" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">per mask id</text>
  </g>

  <!-- Step 5 Rule -->
  <g transform="translate(620, 340)">
    <circle cx="14" cy="14" r="14" fill="#ff9f0a"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>
    <rect x="40" y="0" width="440" height="140" rx="14" fill="white" stroke="#d2d2d7" stroke-width="1.5" filter="url(#shB)"/>
    <text x="260" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">DETERMINISTIC RULE  ·  in-prompt</text>
    <g font-family="SF Mono, Menlo, monospace" font-size="12">
      <text x="62" y="58" fill="#1d1d1f">aspect &lt; 1.2</text>
      <text x="320" y="58" font-weight="600" fill="#ff3b30">→ CFCBK</text>
      <text x="62" y="86" fill="#1d1d1f">1.2 ≤ aspect ≤ 2.5  +  chimney</text>
      <text x="320" y="86" font-weight="600" fill="#0a84ff">→ FCBK</text>
      <text x="62" y="114" fill="#1d1d1f">aspect &gt; 2.5  ·  sharp corners</text>
      <text x="320" y="114" font-weight="600" fill="#ff9500">→ Zigzag</text>
    </g>
  </g>

  <!-- Step 6 Answer -->
  <g transform="translate(40, 380)">
    <circle cx="14" cy="14" r="14" fill="#34c759"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">6</text>
    <rect x="40" y="0" width="220" height="100" rx="14" fill="#34c759" filter="url(#shB)"/>
    <text x="150" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" letter-spacing="0.08em">ANSWER( )</text>
    <text x="150" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="white">Rule-based label</text>
    <text x="150" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">+ supporting_mask_ids</text>
  </g>

  <!-- Arrows -->
  <path d="M220,205 L340,205" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
  <path d="M520,195 Q560,170 620,150" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrBl)"/>
  <path d="M620,165 Q570,200 520,215" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrBl)" stroke-dasharray="4,4"/>
  <path d="M520,225 Q560,250 620,260" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrBl)"/>
  <path d="M620,275 Q570,250 520,235" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrBl)" stroke-dasharray="4,4"/>
  <text x="560" y="145" font-size="11" fill="#0066cc" font-weight="500">call</text>
  <text x="545" y="230" font-size="11" fill="#0066cc" font-weight="500">call</text>
  <text x="545" y="260" font-size="11" fill="#0066cc" font-weight="500">return</text>
  <path d="M410,260 L410,400 L260,430" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
  <path d="M830,340 L830,310" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arrBl)" stroke-dasharray="4,4"/>

  <text x="40" y="535" font-size="12" fill="#6e6e73">The rule lives in the system prompt, not in the tool. Gemma is told to compute the ratio and apply the branches itself.</text>
</svg>
