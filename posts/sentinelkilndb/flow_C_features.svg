<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="380" fill="white"/>

  <text x="20" y="30" font-size="13" fill="#6e6e73" letter-spacing="0.08em">VARIANT C · VISUAL-FEATURE DESCRIPTORS</text>
  <text x="20" y="52" font-size="16" font-weight="600" fill="#1d1d1f">Agent loop with per-class visual signatures in the prompt; no hard rules</text>

  <!-- IMAGE -->
  <g transform="translate(20, 110)">
    <rect width="150" height="90" rx="14" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#sh)"/>
    <text x="75" y="30" text-anchor="middle" font-size="12" fill="#6e6e73" letter-spacing="0.05em">INPUT</text>
    <text x="75" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">Satellite tile</text>
    <text x="75" y="74" text-anchor="middle" font-size="11" fill="#6e6e73">+ class features</text>
  </g>

  <!-- GEMMA -->
  <g transform="translate(220, 90)">
    <rect width="220" height="130" rx="14" fill="#0066cc" filter="url(#sh)"/>
    <text x="110" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)" letter-spacing="0.05em">ORCHESTRATOR</text>
    <text x="110" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="white">Gemma 4</text>
    <text x="110" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">describes what it sees,</text>
    <text x="110" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">matches to class signature,</text>
    <text x="110" y="112" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">classifies without a rule</text>
  </g>

  <!-- OPTIONAL GROUND -->
  <g transform="translate(500, 90)">
    <rect width="220" height="70" rx="12" fill="#1d1d1f" filter="url(#sh)" opacity="0.8"/>
    <text x="110" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" letter-spacing="0.05em">OPTIONAL · ground_expression</text>
    <text x="110" y="46" text-anchor="middle" font-size="13" font-weight="500" fill="white">only if shape is ambiguous</text>
    <text x="110" y="62" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)">"circular kiln" OR "rectangular kiln"</text>
  </g>

  <!-- CLASS FEATURES CARD -->
  <g transform="translate(500, 180)">
    <rect width="440" height="150" rx="14" fill="white" stroke="#d2d2d7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="220" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">CLASS SIGNATURES IN PROMPT</text>
    <circle cx="32" cy="52" r="6" fill="#ff3b30"/>
    <text x="48" y="56" font-size="12" fill="#1d1d1f"><tspan font-weight="600">CFCBK:</tspan> CIRCULAR ring (1:1), central chimney</text>
    <circle cx="32" cy="82" r="6" fill="#0a84ff"/>
    <text x="48" y="86" font-size="12" fill="#1d1d1f"><tspan font-weight="600">FCBK:</tspan> OVAL / stadium-track (1:1.5–1:2.5), single chimney</text>
    <circle cx="32" cy="112" r="6" fill="#ffa500"/>
    <text x="48" y="116" font-size="12" fill="#1d1d1f"><tspan font-weight="600">Zigzag:</tspan> RECTANGULAR with sharp corners, zigzag walls</text>
    <circle cx="32" cy="134" r="6" fill="#6e6e73"/>
    <text x="48" y="138" font-size="12" fill="#1d1d1f"><tspan font-weight="600">none:</tspan> no kiln visible</text>
  </g>

  <!-- ANSWER -->
  <g transform="translate(20, 230)">
    <rect width="170" height="110" rx="14" fill="#34c759" filter="url(#sh)"/>
    <text x="85" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" letter-spacing="0.05em">answer(...)</text>
    <text x="85" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="white">Class label</text>
    <text x="85" y="76" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">reasoned from</text>
    <text x="85" y="92" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">visual match</text>
  </g>

  <!-- ARROWS -->
  <path d="M170,150 L220,150" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M440,125 L500,125" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="4,3"/>
  <path d="M500,135 Q470,130 440,150" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="4,3"/>
  <path d="M330,220 L330,250 L190,280" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M720,225 Q680,230 600,220" stroke="#6e6e73" stroke-width="1.2" fill="none" stroke-dasharray="2,3"/>

  <text x="456" y="115" font-size="10" fill="#0066cc">optional</text>
</svg>
