<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrCb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <filter id="shC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1100" height="520" fill="white"/>

  <text x="40" y="38" font-size="12" fill="#6e6e73" letter-spacing="0.1em" font-weight="500">VARIANT C · VISUAL-FEATURE DESCRIPTORS</text>
  <text x="40" y="64" font-size="20" font-weight="600" fill="#1d1d1f" letter-spacing="-0.01em">Agent loop with per-class visual signatures — no hard rule</text>

  <!-- Step 1 input -->
  <g transform="translate(40, 160)">
    <circle cx="14" cy="14" r="14" fill="#1d1d1f"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
    <rect x="40" y="0" width="180" height="90" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2" filter="url(#shC)"/>
    <text x="130" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">INPUT</text>
    <text x="130" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Satellite tile</text>
    <text x="130" y="74" text-anchor="middle" font-size="12" fill="#6e6e73">+ visual prototypes</text>
  </g>

  <!-- Step 2 orchestrator -->
  <g transform="translate(300, 140)">
    <circle cx="14" cy="14" r="14" fill="#0066cc"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
    <rect x="40" y="0" width="240" height="130" rx="14" fill="#0066cc" filter="url(#shC)"/>
    <text x="160" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)" letter-spacing="0.08em">ORCHESTRATOR</text>
    <text x="160" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="white">Gemma 4 31B</text>
    <text x="160" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">describes the shape,</text>
    <text x="160" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">matches to signature,</text>
    <text x="160" y="112" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">classifies</text>
  </g>

  <!-- Step 3 optional tool -->
  <g transform="translate(620, 140)">
    <circle cx="14" cy="14" r="14" fill="#8e8e93"/>
    <text x="14" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="white">3*</text>
    <rect x="40" y="0" width="260" height="80" rx="12" fill="#1d1d1f" opacity="0.75" filter="url(#shC)"/>
    <text x="170" y="24" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.75)" letter-spacing="0.08em">OPTIONAL · ground_expression</text>
    <text x="170" y="46" text-anchor="middle" font-size="13" font-weight="500" fill="white">only if shape ambiguous</text>
    <text x="170" y="64" text-anchor="middle" font-size="10" fill="rgba(245,245,247,0.7)" font-family="SF Mono, Menlo, monospace">"oval kiln" | "rectangular kiln"</text>
  </g>

  <!-- Step 4 Class signatures -->
  <g transform="translate(620, 250)">
    <circle cx="14" cy="14" r="14" fill="#ff9f0a"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>
    <rect x="40" y="0" width="420" height="170" rx="14" fill="white" stroke="#d2d2d7" stroke-width="1.5" filter="url(#shC)"/>
    <text x="250" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">CLASS SIGNATURES  ·  in prompt</text>
    <circle cx="66" cy="58" r="7" fill="#ff3b30"/>
    <text x="82" y="62" font-size="12" font-weight="600" fill="#1d1d1f">CFCBK</text>
    <text x="140" y="62" font-size="12" fill="#1d1d1f">— nearly CIRCULAR ring, central chimney</text>
    <circle cx="66" cy="88" r="7" fill="#0a84ff"/>
    <text x="82" y="92" font-size="12" font-weight="600" fill="#1d1d1f">FCBK</text>
    <text x="140" y="92" font-size="12" fill="#1d1d1f">— OVAL / stadium-track (1:1.5–1:2.5)</text>
    <circle cx="66" cy="118" r="7" fill="#ff9500"/>
    <text x="82" y="122" font-size="12" font-weight="600" fill="#1d1d1f">Zigzag</text>
    <text x="140" y="122" font-size="12" fill="#1d1d1f">— RECTANGULAR, sharp corners, zigzag walls</text>
    <circle cx="66" cy="148" r="7" fill="#8e8e93"/>
    <text x="82" y="152" font-size="12" font-weight="600" fill="#1d1d1f">none</text>
    <text x="140" y="152" font-size="12" fill="#1d1d1f">— no kiln visible</text>
  </g>

  <!-- Step 5 answer -->
  <g transform="translate(40, 380)">
    <circle cx="14" cy="14" r="14" fill="#34c759"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>
    <rect x="40" y="0" width="220" height="100" rx="14" fill="#34c759" filter="url(#shC)"/>
    <text x="150" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" letter-spacing="0.08em">ANSWER( )</text>
    <text x="150" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="white">Class label</text>
    <text x="150" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">reasoned from visual match</text>
  </g>

  <!-- arrows -->
  <path d="M220,205 L340,205" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>
  <path d="M580,195 Q600,185 620,175" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrCb)" stroke-dasharray="4,4"/>
  <path d="M620,195 Q600,210 580,220" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrCb)" stroke-dasharray="4,4"/>
  <text x="585" y="170" font-size="11" fill="#6e6e73" font-style="italic">optional</text>
  <!-- prompt reference -->
  <path d="M620,310 Q500,300 420,270" stroke="#ff9f0a" stroke-width="1.5" fill="none" stroke-dasharray="3,4"/>
  <text x="495" y="293" font-size="10" fill="#ff9f0a" font-weight="500">reads</text>
  <!-- answer -->
  <path d="M410,270 L410,400 L260,425" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>

  <text x="40" y="495" font-size="12" fill="#6e6e73">No hard threshold — Gemma uses the visual signatures as a rubric and picks the best match. Falcon tools are available but called only on demand.</text>
</svg>
