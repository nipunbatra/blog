<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="980" height="460" fill="white"/>

  <!-- INPUT -->
  <g transform="translate(40,40)">
    <rect width="180" height="100" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1" filter="url(#softShadow)"/>
    <text x="90" y="34" text-anchor="middle" font-size="13" fill="#6e6e73" letter-spacing="0.05em">USER</text>
    <text x="90" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Image + question</text>
    <text x="90" y="80" text-anchor="middle" font-size="11" fill="#6e6e73">e.g. "Is there a brick kiln?"</text>
  </g>

  <!-- ORCHESTRATOR -->
  <g transform="translate(380,30)">
    <rect width="220" height="120" rx="14" fill="#0066cc" filter="url(#softShadow)"/>
    <text x="110" y="34" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="0.05em">ORCHESTRATOR · VLM</text>
    <text x="110" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="white">Gemma 4 31B</text>
    <text x="110" y="86" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">Plans tool calls,</text>
    <text x="110" y="102" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">reasons over geometry</text>
  </g>

  <!-- TOOLS -->
  <g transform="translate(720,20)">
    <rect width="220" height="80" rx="12" fill="#1d1d1f" filter="url(#softShadow)"/>
    <text x="110" y="28" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)" letter-spacing="0.05em">TOOL · ground_expression</text>
    <text x="110" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="white">Falcon Perception</text>
    <text x="110" y="68" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">→ masks + centroids + bbox</text>
  </g>

  <g transform="translate(720,110)">
    <rect width="220" height="60" rx="12" fill="white" stroke="#d2d2d7" filter="url(#softShadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">TOOL · compute_relations</text>
    <text x="110" y="42" text-anchor="middle" font-size="13" font-weight="500" fill="#1d1d1f">numpy IoU / dist / area</text>
  </g>

  <g transform="translate(720,180)">
    <rect width="220" height="60" rx="12" fill="white" stroke="#d2d2d7" filter="url(#softShadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">TOOL · get_crop</text>
    <text x="110" y="42" text-anchor="middle" font-size="13" font-weight="500" fill="#1d1d1f">zoom on a small mask</text>
  </g>

  <!-- ANSWER -->
  <g transform="translate(380,300)">
    <rect width="220" height="120" rx="14" fill="#34c759" filter="url(#softShadow)"/>
    <text x="110" y="32" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)" letter-spacing="0.05em">answer(...)</text>
    <text x="110" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="white">Final classification</text>
    <text x="110" y="82" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">e.g. "CFCBK"</text>
    <text x="110" y="100" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.95)">supporting_mask_ids = [1]</text>
  </g>

  <!-- FINAL IMAGE -->
  <g transform="translate(40,300)">
    <rect width="180" height="120" rx="14" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#softShadow)"/>
    <text x="90" y="32" text-anchor="middle" font-size="12" fill="#6e6e73" letter-spacing="0.05em">RECEIPT</text>
    <text x="90" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">Image with</text>
    <text x="90" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">supporting masks</text>
    <text x="90" y="100" text-anchor="middle" font-size="11" fill="#6e6e73">opens for human audit</text>
  </g>

  <!-- ARROWS -->
  <!-- Input → orchestrator -->
  <path d="M220,90 H380" stroke="#6e6e73" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Orchestrator ↔ tools (loop) -->
  <path d="M600,80 H720" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="660" y="68" text-anchor="middle" font-size="11" fill="#0066cc">call</text>
  <path d="M720,150 Q660,150 600,110" stroke="#0066cc" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)" stroke-dasharray="4,3"/>
  <text x="668" y="148" text-anchor="start" font-size="11" fill="#0066cc">return</text>

  <!-- Loop self arrow on orchestrator -->
  <path d="M490,150 Q500,200 490,210 Q480,220 490,150" stroke="#6e6e73" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="200" font-size="11" fill="#6e6e73">loop</text>

  <!-- Orchestrator → answer -->
  <path d="M490,150 V300" stroke="#6e6e73" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="225" font-size="11" fill="#6e6e73">terminate</text>

  <!-- Answer → receipt -->
  <path d="M380,360 H220" stroke="#6e6e73" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Title -->
  <text x="490" y="445" text-anchor="middle" font-size="11" fill="#6e6e73">PR #926 grounded reasoning loop · solid arrow = data flow · dashed = tool result · self-loop = next step</text>
</svg>
