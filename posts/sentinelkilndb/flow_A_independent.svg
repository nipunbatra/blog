<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="320" fill="white"/>

  <!-- Title -->
  <text x="20" y="30" font-size="13" fill="#6e6e73" letter-spacing="0.08em">VARIANT A · INDEPENDENT PROBES</text>
  <text x="20" y="52" font-size="16" font-weight="600" fill="#1d1d1f">Two parallel one-shot calls, no interaction</text>

  <!-- IMAGE -->
  <g transform="translate(20, 130)">
    <rect width="170" height="90" rx="14" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#sh)"/>
    <text x="85" y="30" text-anchor="middle" font-size="12" fill="#6e6e73" letter-spacing="0.05em">INPUT</text>
    <text x="85" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">Satellite tile</text>
    <text x="85" y="74" text-anchor="middle" font-size="11" fill="#6e6e73">~0.6 m/pixel · ESRI</text>
  </g>

  <!-- FALCON -->
  <g transform="translate(400, 85)">
    <rect width="220" height="80" rx="12" fill="#1d1d1f" filter="url(#sh)"/>
    <text x="110" y="26" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)" letter-spacing="0.05em">FALCON PERCEPTION</text>
    <text x="110" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="white">ground_expression("brick kiln")</text>
    <text x="110" y="68" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.7)">→ mask count, bboxes</text>
  </g>

  <!-- GEMMA -->
  <g transform="translate(400, 185)">
    <rect width="220" height="80" rx="12" fill="#0066cc" filter="url(#sh)"/>
    <text x="110" y="26" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)" letter-spacing="0.05em">GEMMA 4 · one-shot</text>
    <text x="110" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="white">classify(image)</text>
    <text x="110" y="68" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">→ class string + confidence</text>
  </g>

  <!-- OUTPUTS -->
  <g transform="translate(760, 85)">
    <rect width="180" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#sh)"/>
    <text x="90" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">OUTPUT 1</text>
    <text x="90" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">Detection count</text>
    <text x="90" y="70" text-anchor="middle" font-size="11" fill="#6e6e73">raw Falcon n_masks</text>
  </g>

  <g transform="translate(760, 185)">
    <rect width="180" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7" filter="url(#sh)"/>
    <text x="90" y="26" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.05em">OUTPUT 2</text>
    <text x="90" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">Class prediction</text>
    <text x="90" y="70" text-anchor="middle" font-size="11" fill="#6e6e73">Gemma's JSON blob</text>
  </g>

  <!-- ARROWS -->
  <path d="M190,165 L400,125" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M190,185 L400,225" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M620,125 L760,125" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M620,225 L760,225" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Note -->
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#6e6e73">No data flows between the two branches — the outputs are combined by the caller, not the models</text>
</svg>
