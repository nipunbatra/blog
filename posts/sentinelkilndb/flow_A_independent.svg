<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1100" height="440" fill="white"/>

  <!-- Title block -->
  <text x="40" y="38" font-size="12" fill="#6e6e73" letter-spacing="0.1em" font-weight="500">VARIANT A · INDEPENDENT PROBES</text>
  <text x="40" y="64" font-size="20" font-weight="600" fill="#1d1d1f" letter-spacing="-0.01em">Two parallel one-shot calls — models never talk to each other</text>

  <!-- Step 1 · IMAGE -->
  <g transform="translate(40, 160)">
    <circle cx="14" cy="14" r="14" fill="#1d1d1f"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
    <rect x="40" y="0" width="200" height="100" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2" filter="url(#sh)"/>
    <text x="140" y="28" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">INPUT</text>
    <text x="140" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1d1f">Satellite tile</text>
    <text x="140" y="78" text-anchor="middle" font-size="12" fill="#6e6e73">ESRI · 0.6 m/pixel · 250 m</text>
  </g>

  <!-- Step 2a · FALCON (upper branch) -->
  <g transform="translate(420, 100)">
    <circle cx="14" cy="14" r="14" fill="#0066cc"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">2a</text>
    <rect x="40" y="0" width="300" height="100" rx="14" fill="#1d1d1f" filter="url(#sh)"/>
    <text x="190" y="28" text-anchor="middle" font-size="11" fill="rgba(245,245,247,0.65)" letter-spacing="0.08em">PERCEPTION · ONE CALL</text>
    <text x="190" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="white">Falcon Perception</text>
    <text x="190" y="78" text-anchor="middle" font-size="12" fill="rgba(245,245,247,0.75)" font-family="SF Mono, Menlo, monospace">ground_expression("brick kiln")</text>
  </g>

  <!-- Step 2b · GEMMA (lower branch) -->
  <g transform="translate(420, 240)">
    <circle cx="14" cy="14" r="14" fill="#0066cc"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">2b</text>
    <rect x="40" y="0" width="300" height="100" rx="14" fill="#0066cc" filter="url(#sh)"/>
    <text x="190" y="28" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)" letter-spacing="0.08em">CLASSIFIER · ONE CALL</text>
    <text x="190" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="white">Gemma 4 31B</text>
    <text x="190" y="78" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)" font-family="SF Mono, Menlo, monospace">run_baseline(image, prompt)</text>
  </g>

  <!-- Step 3 · OUTPUTS -->
  <g transform="translate(840, 100)">
    <circle cx="14" cy="14" r="14" fill="#34c759"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
    <rect x="40" y="0" width="210" height="100" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2" filter="url(#sh)"/>
    <text x="145" y="28" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">OUTPUT A</text>
    <text x="145" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">Mask overlay</text>
    <text x="145" y="78" text-anchor="middle" font-size="12" fill="#6e6e73">N masks + bboxes</text>
  </g>

  <g transform="translate(840, 240)">
    <circle cx="14" cy="14" r="14" fill="#34c759"/>
    <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
    <rect x="40" y="0" width="210" height="100" rx="14" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2" filter="url(#sh)"/>
    <text x="145" y="28" text-anchor="middle" font-size="11" fill="#6e6e73" letter-spacing="0.08em">OUTPUT B</text>
    <text x="145" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">Class label</text>
    <text x="145" y="78" text-anchor="middle" font-size="12" fill="#6e6e73">CFCBK | FCBK | Zigzag</text>
  </g>

  <!-- ARROWS -->
  <!-- input → Falcon -->
  <path d="M280,200 L330,200 Q355,200 370,180 L420,150" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <!-- input → Gemma -->
  <path d="M280,220 L330,220 Q355,220 370,240 L420,290" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <!-- Falcon → output A -->
  <path d="M760,150 L840,150" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <!-- Gemma → output B -->
  <path d="M760,290 L840,290" stroke="#6e6e73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- Annotation: no link -->
  <line x1="570" y1="200" x2="570" y2="240" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="580" y="225" font-size="11" font-weight="600" fill="#ff3b30">✗ no link</text>

  <!-- Footer note -->
  <text x="40" y="410" font-size="12" fill="#6e6e73">The two outputs are independent. Falcon's mask count does not inform Gemma's class; Gemma's class does not consult Falcon's geometry.</text>
  <text x="40" y="428" font-size="12" fill="#6e6e73">Cheapest variant — one VLM call, one Falcon call, no loop.</text>
</svg>
