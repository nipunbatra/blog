<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="ni_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Neural Network Icon -->
  <g transform="translate(50, 40)">
    <!-- Connections -->
    <g stroke="url(#ni_grad)" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <!-- Perimeter -->
      <line x1="30" y1="60" x2="50" y2="30"/>
      <line x1="50" y1="30" x2="90" y2="30"/>
      <line x1="90" y1="30" x2="110" y2="60"/>
      <line x1="110" y1="60" x2="90" y2="90"/>
      <line x1="90" y1="90" x2="50" y2="90"/>
      <line x1="50" y1="90" x2="30" y2="60"/>
      
      <!-- Internal Mesh -->
      <line x1="70" y1="60" x2="30" y2="60"/>
      <line x1="70" y1="60" x2="50" y2="30"/>
      <line x1="70" y1="60" x2="90" y2="30"/>
      <line x1="70" y1="60" x2="110" y2="60"/>
      <line x1="70" y1="60" x2="90" y2="90"/>
      <line x1="70" y1="60" x2="50" y2="90"/>
      
      <!-- Cross connections for complexity -->
      <line x1="50" y1="30" x2="90" y2="90" opacity="0.4"/>
      <line x1="50" y1="90" x2="90" y2="30" opacity="0.4"/>
    </g>

    <!-- Nodes -->
    <g fill="url(#ni_grad)">
      <circle cx="30" cy="60" r="4.5"/>
      <circle cx="50" cy="30" r="4.5"/>
      <circle cx="90" cy="30" r="4.5"/>
      <circle cx="110" cy="60" r="4.5"/>
      <circle cx="90" cy="90" r="4.5"/>
      <circle cx="50" cy="90" r="4.5"/>
      <!-- Central Node (Pulse) -->
      <circle cx="70" cy="60" r="6"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(170, 110)">
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" fill="url(#ni_grad)">
      <tspan font-weight="700" letter-spacing="1">NEURAL</tspan>
      <tspan x="0" dy="36" font-size="28" font-weight="300" letter-spacing="3" fill="#5c5c70">INSIGHTS</tspan>
    </text>
  </g>
</svg>