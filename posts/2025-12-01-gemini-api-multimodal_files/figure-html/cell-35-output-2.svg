<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background (Optional, kept transparent for logo usage) -->
  
  <!-- Logo Mark: Stylized Neural Network Brain -->
  <g transform="translate(45, 50)">
    <!-- Connections -->
    <path d="M25,80 L45,40 L80,35 L100,70 L85,110 L45,110 L25,80 Z               M25,80 L60,75               M45,40 L60,75               M80,35 L60,75               M100,70 L60,75               M85,110 L60,75               M45,110 L60,75              M80,35 L100,70" fill="none" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Nodes -->
    <circle cx="25" cy="80" r="5" fill="url(#brandGradient)"/> <!-- Back -->
    <circle cx="45" cy="40" r="5" fill="url(#brandGradient)"/> <!-- Top Back -->
    <circle cx="80" cy="35" r="5" fill="url(#brandGradient)"/> <!-- Top Front -->
    <circle cx="100" cy="70" r="5" fill="url(#brandGradient)"/> <!-- Front -->
    <circle cx="85" cy="110" r="5" fill="url(#brandGradient)"/> <!-- Bottom Front -->
    <circle cx="45" cy="110" r="5" fill="url(#brandGradient)"/> <!-- Bottom Back -->
    <circle cx="60" cy="75" r="6" fill="#fff" stroke="url(#brandGradient)" stroke-width="3"/> <!-- Center Node (Processor) -->
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="160" y="105" font-weight="700" font-size="38" fill="#2d3748" letter-spacing="-0.5">NEURAL</text>
    <text x="162" y="140" font-weight="300" font-size="24" fill="url(#brandGradient)" letter-spacing="4">INSIGHTS</text>
  </g>
</svg>