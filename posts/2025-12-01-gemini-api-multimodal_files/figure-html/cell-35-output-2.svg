<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="neural-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background (Optional, kept transparent for logo usage) -->
  
  <!-- Logo Container -->
  <g transform="translate(40, 50)">
    <!-- Neural Network / Brain Icon -->
    <g stroke="url(#neural-gradient)" stroke-width="2" fill="none">
      <!-- Neural Connections -->
      <!-- Perimeter -->
      <path d="M20 60 C 20 40, 35 20, 60 20 C 85 20, 100 40, 100 60 C 100 80, 80 95, 60 95 C 40 95, 20 80, 20 60 Z" opacity="0.3"/>
      
      <!-- Internal Mesh -->
      <path d="M30 55 L 55 35 L 85 40 L 90 65 L 70 85 L 45 80 Z" opacity="0.6"/>
      <path d="M30 55 L 60 60 L 85 40" opacity="0.6"/>
      <path d="M55 35 L 60 60 L 70 85" opacity="0.6"/>
      <path d="M45 80 L 60 60 L 90 65" opacity="0.6"/>
    </g>

    <!-- Nodes -->
    <g fill="#fff" stroke="url(#neural-gradient)" stroke-width="2.5">
      <circle cx="30" cy="55" r="5"/>
      <circle cx="55" cy="35" r="5"/>
      <circle cx="85" cy="40" r="5"/>
      <circle cx="90" cy="65" r="5"/>
      <circle cx="70" cy="85" r="5"/>
      <circle cx="45" cy="80" r="5"/>
      <!-- Central Node (Highlighted) -->
      <circle cx="60" cy="60" r="6" fill="url(#neural-gradient)" stroke="none"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(160, 108)">
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" fill="url(#neural-gradient)">
      <tspan font-weight="700">Neural</tspan>
      <tspan x="0" dy="38" font-weight="300" letter-spacing="1.5" font-size="28" fill="#4a5568">Insights</tspan>
    </text>
  </g>
</svg>