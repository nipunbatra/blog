project:
  type: website

website:
  title: "Nipun Batra Blog"
  description: "Notes on machine learning, VLMs, and building things."
  navbar:
    pinned: true
    right:
        - href: https://nipunbatra.github.io
          text: Homepage
  page-footer:
    left: "© Nipun Batra"
    right:
      - icon: github
        href: https://github.com/nipunbatra
  twitter-card: true
  open-graph: true
format:
  html:
    theme:
      light: [litera, styles.scss]
      dark: [darkly, styles-dark.scss]
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    code-annotations: select
    fig-align: center
    fig-cap-location: bottom
    toc: true
    toc-depth: 3
    toc-location: right
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false


execute:
  freeze: auto
