on:
  workflow_dispatch:
  push:
    branches: master

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache rendered site
        uses: actions/cache@v4
        with:
          path: _site
          key: quarto-rendered-${{ github.run_number }}
          restore-keys: |
            quarto-rendered-

      - name: Get last gh-pages commit
        id: last-build
        run: |
          # Get the last commit that built gh-pages successfully
          git fetch origin gh-pages
          LAST_COMMIT=$(git rev-parse origin/gh-pages)
          echo "commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

      - name: Detect changed files
        id: changed
        run: |
          LAST_COMMIT="${{ steps.last-build.outputs.commit }}"
          echo "Last gh-pages commit: $LAST_COMMIT"

          # Get list of changed post files
          CHANGED=$(git diff --name-only $LAST_COMMIT HEAD -- posts/*.qmd posts/*.md posts/*.ipynb 2>/dev/null || true)

          if [ -z "$CHANGED" ]; then
            echo "No changes detected in posts"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Convert newlines to spaces for the output
            FILES=$(echo "$CHANGED" | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "Changed files: $CHANGED"
          fi

      - name: Install Python dependencies
        if: steps.changed.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install uv "marimo>=0.13.3" matplotlib numpy jupyter nbformat ipykernel

      - name: Render changed files only
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Restore cached _site if it exists
          if [ -d "_site" ]; then
            echo "Using cached _site directory"
          else
            echo "No cache found, doing initial render"
            quarto render
            exit 0
          fi

          # Render only changed files
          for file in ${{ steps.changed.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "Rendering: $file"
              quarto render "$file"
            fi
          done

      - name: Deploy to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
